services:
  - type: web
    name: simabazi-island
    runtime: python
    rootDir: island_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # 在Render Dashboard手动填入
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.0-flash-preview-image-generation
      - key: TRIPO_API_KEY
        sync: false          # 在Render Dashboard手动填入
    disk:
      name: island-cache
      mountPath: /opt/render/project/src/island_service
      sizeGB: 1
