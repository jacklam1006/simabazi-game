<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>司马八字 · 命盘沙盒</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a12;
      color: #e8e0d0;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0a0a12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #loading-screen h1 {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 8px;
      color: #c9a96e;
      margin-bottom: 12px;
    }
    #loading-screen p {
      font-size: 13px;
      color: rgba(232,224,208,0.4);
      letter-spacing: 2px;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #canvas-container canvas {
      display: block;
    }
    /* 顶部 HUD */
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(10,10,18,0.8), transparent);
      pointer-events: none;
    }
    #hud-title {
      font-size: 14px;
      letter-spacing: 3px;
      color: #c9a96e;
      font-weight: 600;
    }
    #hud-user {
      font-size: 12px;
      color: rgba(232,224,208,0.5);
    }
  </style>
</head>
<body>

  <!-- 加载屏 -->
  <div id="loading-screen">
    <h1>司马八字</h1>
    <p>正在推演命格 · 构建你的沙盒宇宙</p>
  </div>

  <!-- 3D 画布容器 -->
  <div id="canvas-container"></div>

  <!-- HUD 覆盖层 -->
  <div id="hud" style="display:none">
    <div id="hud-title">命盘沙盒</div>
    <div id="hud-user">— · —</div>
  </div>

  <!-- Three.js（CDN，r128） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- lunar-javascript（6tail）：四柱排盘 + 大运 + 纳音 -->
  <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>

  <!-- 核心模块（按顺序加载） -->
  <script src="js/config.js"></script>
  <script src="js/bazi-engine.js"></script>
  <script src="js/scene-builder.js"></script>
  <script src="js/annotation.js"></script>
  <script src="js/user-journey.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
