<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>司马八字 · 命盘沙盒</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      background:#0a0a12; color:#e8e0d0;
      font-family:'PingFang SC','Noto Serif SC','Microsoft YaHei',sans-serif;
      height:100vh; overflow:hidden;
    }
    #canvas-container { position:fixed; inset:0; }

    /* ── 加载屏 ── */
    #loading-screen {
      position:fixed; inset:0; background:#0a0a12;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      z-index:200;
    }

    /* ── 顶部 HUD ── */
    #hud {
      position:fixed; top:0; left:0; right:0; z-index:50;
      padding:12px 20px;
      display:none; justify-content:space-between; align-items:center;
      background:linear-gradient(to bottom,rgba(10,10,18,.92),transparent);
      pointer-events:none;
    }
    #hud-title { font-size:13px; letter-spacing:4px; color:#c9a96e; font-weight:500; }
    #hud-user  { font-size:11px; color:rgba(232,224,208,.5); letter-spacing:1px; }

    /* ── 八字表 Panel（底部，可折叠）── */
    #bazi-table-wrap {
      position:fixed; bottom:0; left:0; right:0; z-index:60;
      display:none;
      flex-direction:column; align-items:center;
    }
    #bazi-table-toggle {
      background:rgba(201,169,110,.15); border:1px solid rgba(201,169,110,.3);
      border-radius:8px 8px 0 0; padding:5px 24px;
      color:#c9a96e; font-size:11px; letter-spacing:3px; cursor:pointer;
      border-bottom:none; outline:none;
    }
    #bazi-table-panel {
      width:100%; max-width:680px;
      background:rgba(10,10,20,.95);
      border-top:1px solid rgba(201,169,110,.25);
      padding:14px 16px 12px;
      transition:max-height .35s ease; overflow:hidden;
      max-height:0; /* collapsed by default */
    }
    #bazi-table-panel.open { max-height:240px; }

    /* 四柱表格 */
    .bazi-grid {
      display:grid; grid-template-columns:repeat(4,1fr);
      gap:0; border:1px solid rgba(201,169,110,.2); border-radius:8px;
      overflow:hidden; margin-bottom:10px;
    }
    .bazi-col { display:flex; flex-direction:column; }
    .bazi-col:not(:last-child) { border-right:1px solid rgba(201,169,110,.15); }
    .bazi-cell {
      padding:5px 4px; text-align:center; font-size:12px;
      border-bottom:1px solid rgba(201,169,110,.1);
    }
    .bazi-cell:last-child { border-bottom:none; }
    .bazi-cell.head { font-size:10px; color:rgba(232,224,208,.4); letter-spacing:1px; background:rgba(201,169,110,.06); }
    .bazi-cell.stem { font-size:20px; font-weight:600; }
    .bazi-cell.branch { font-size:17px; }
    .bazi-cell.shishen { font-size:10px; color:rgba(201,169,110,.8); }
    .bazi-cell.nayin { font-size:9px; color:rgba(232,224,208,.4); }
    .bazi-cell.day-col { background:rgba(201,169,110,.08); }

    /* 命盘要素条 */
    .bazi-meta {
      display:flex; flex-wrap:wrap; gap:8px; align-items:center;
      font-size:10px; color:rgba(232,224,208,.45);
    }
    .meta-tag {
      background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
      border-radius:4px; padding:2px 8px; letter-spacing:1px; font-size:10px;
    }
    .meta-tag.good { border-color:rgba(111,207,151,.4); color:rgba(111,207,151,.9); }
    .meta-tag.warn { border-color:rgba(235,87,87,.4); color:rgba(235,87,87,.85); }
    .meta-tag.gold { border-color:rgba(201,169,110,.4); color:#c9a96e; }

    /* 五行强弱条 */
    .wx-mini { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .wx-bar-wrap { display:flex; align-items:center; gap:4px; }
    .wx-label { font-size:10px; width:14px; }
    .wx-track { width:48px; height:5px; background:rgba(255,255,255,.08); border-radius:3px; overflow:hidden; }
    .wx-fill  { height:100%; border-radius:3px; }
    .wx-pct   { font-size:9px; opacity:.5; width:24px; }

    /* ── 区域分析面板（右侧滑入）── */
    #zone-panel {
      position:fixed; top:0; right:0; bottom:0; width:min(340px,90vw);
      background:rgba(8,8,18,.96);
      border-left:1px solid rgba(201,169,110,.2);
      z-index:80; padding:24px 20px 24px;
      transform:translateX(100%); transition:transform .3s ease;
      overflow-y:auto; display:flex; flex-direction:column; gap:14px;
    }
    #zone-panel.open { transform:translateX(0); }
    #zone-panel-close {
      position:absolute; top:16px; right:16px;
      background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
      border-radius:6px; width:28px; height:28px; color:#e8e0d0;
      font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    }
    .zone-panel-badge {
      display:inline-flex; align-items:center; gap:6px;
      padding:4px 10px; border-radius:20px; font-size:11px; font-weight:600;
      letter-spacing:1px;
    }
    .badge-good { background:rgba(111,207,151,.12); border:1px solid rgba(111,207,151,.4); color:#6FCF97; }
    .badge-warn { background:rgba(235,87,87,.12); border:1px solid rgba(235,87,87,.4); color:#EB5757; }
    .badge-neutral { background:rgba(201,169,110,.1); border:1px solid rgba(201,169,110,.3); color:#c9a96e; }

    .zone-panel-title { font-size:18px; font-weight:600; letter-spacing:2px; color:#e8e0d0; line-height:1.3; }
    .zone-panel-subtitle { font-size:12px; color:rgba(232,224,208,.4); letter-spacing:1px; margin-top:2px; }

    .zone-section { display:flex; flex-direction:column; gap:6px; }
    .zone-section-title {
      font-size:10px; letter-spacing:2px; color:rgba(201,169,110,.6);
      text-transform:uppercase; padding-bottom:4px;
      border-bottom:1px solid rgba(201,169,110,.12);
    }
    .zone-section-body { font-size:13px; color:rgba(232,224,208,.75); line-height:1.8; }

    .insight-item {
      display:flex; align-items:flex-start; gap:8px;
      padding:8px 10px; border-radius:8px; font-size:12px; line-height:1.6;
    }
    .insight-good { background:rgba(111,207,151,.07); border:1px solid rgba(111,207,151,.2); }
    .insight-warn { background:rgba(235,87,87,.07); border:1px solid rgba(235,87,87,.2); }
    .insight-icon { font-size:14px; flex-shrink:0; margin-top:1px; }

    /* ── 报告按钮 ── */
    #report-btn {
      position:fixed; bottom:72px; right:18px; z-index:70;
      background:linear-gradient(135deg,#c9a96e,#a07840);
      border:none; border-radius:22px; padding:10px 20px;
      color:#0a0a12; font-size:12px; font-weight:700; letter-spacing:3px;
      cursor:pointer; box-shadow:0 4px 24px rgba(201,169,110,.3);
      display:none; transition:opacity .2s;
    }
    #report-btn:hover { opacity:.85; }

    /* ── 报告 Modal ── */
    #report-modal {
      position:fixed; inset:0; z-index:100;
      background:rgba(6,6,14,.97);
      display:none; flex-direction:column;
      overflow-y:auto;
    }
    #report-modal.open { display:flex; }
    .report-header {
      position:sticky; top:0;
      background:rgba(6,6,14,.95);
      border-bottom:1px solid rgba(201,169,110,.2);
      padding:16px 20px; display:flex; align-items:center; justify-content:space-between;
      z-index:2;
    }
    .report-header h2 { font-size:16px; letter-spacing:4px; color:#c9a96e; font-weight:300; }
    #report-close {
      background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
      border-radius:6px; width:32px; height:32px; color:#e8e0d0;
      font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    }
    .report-body { padding:20px; max-width:700px; margin:0 auto; width:100%; }
    .report-section {
      margin-bottom:28px;
      border:1px solid rgba(201,169,110,.12); border-radius:12px;
      overflow:hidden;
    }
    .report-section-head {
      background:rgba(201,169,110,.06); padding:12px 16px;
      font-size:12px; color:#c9a96e; letter-spacing:3px;
      border-bottom:1px solid rgba(201,169,110,.12);
    }
    .report-section-body { padding:16px; font-size:13px; color:rgba(232,224,208,.75); line-height:1.9; }

    .four-pillar-table {
      display:grid; grid-template-columns:repeat(4,1fr);
      border:1px solid rgba(201,169,110,.2); border-radius:8px; overflow:hidden;
      margin:12px 0;
    }
    .fp-col { display:flex; flex-direction:column; }
    .fp-col:not(:last-child){ border-right:1px solid rgba(201,169,110,.12); }
    .fp-cell {
      padding:8px 6px; text-align:center;
      border-bottom:1px solid rgba(201,169,110,.08);
      font-size:12px;
    }
    .fp-cell:last-child { border-bottom:none; }
    .fp-cell.hd { font-size:10px; color:rgba(232,224,208,.35); background:rgba(201,169,110,.04); }
    .fp-cell.s { font-size:22px; font-weight:700; }
    .fp-cell.b { font-size:18px; }
    .fp-cell.day-main { background:rgba(201,169,110,.07); }

    /* ── 禁止 3D canvas 下面元素出现时的闪动 ── */
    canvas { display:block; }
  </style>
</head>
<body>

<!-- 加载/输入屏 -->
<div id="loading-screen">
  <div style="text-align:center;padding:40px 24px">
    <h1 style="color:#c9a96e;font-size:22px;letter-spacing:6px;font-weight:300;margin-bottom:8px">司马八字</h1>
    <p style="color:rgba(232,224,208,.35);font-size:11px;letter-spacing:3px;margin-bottom:2px">天机已动 · 为你推演命格</p>
  </div>
</div>

<!-- 3D 画布 -->
<div id="canvas-container"></div>

<!-- 顶部 HUD -->
<div id="hud">
  <div id="hud-title">命盘沙盒</div>
  <div id="hud-user">— · —</div>
</div>

<!-- 八字表（底部折叠） -->
<div id="bazi-table-wrap">
  <button id="bazi-table-toggle" onclick="window._journey.toggleBaziTable()">八字命盘 ∧</button>
  <div id="bazi-table-panel">
    <div id="bazi-table-inner"><!-- 由 JS 填充 --></div>
  </div>
</div>

<!-- 区域分析面板（右侧） -->
<div id="zone-panel">
  <button id="zone-panel-close" onclick="window._journey.closeZonePanel()">×</button>
  <div id="zone-panel-content"></div>
</div>

<!-- 完整报告按钮 -->
<button id="report-btn" onclick="window._journey.showReport()">查看完整命盘报告</button>

<!-- 完整报告 Modal -->
<div id="report-modal">
  <div class="report-header">
    <h2>完整命盘报告</h2>
    <button id="report-close" onclick="window._journey.closeReport()">×</button>
  </div>
  <div class="report-body" id="report-body"><!-- 由 JS 填充 --></div>
</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- lunar-javascript -->
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
<!-- 核心模块 -->
<script src="js/config.js"></script>
<script src="js/bazi-engine.js"></script>
<script src="js/scene-builder.js"></script>
<script src="js/annotation.js"></script>
<script src="js/user-journey.js"></script>
<script src="js/main.js"></script>

</body>
</html>
