services:
  # ── 岛屿生成后端（FastAPI + Gemini + TripoAI）────────────────
  - type: web
    name: simabazi-island
    runtime: python
    region: singapore
    pythonVersion: "3.11.8"
    rootDir: island_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3-pro-image
      - key: TRIPO_API_KEY
        sync: false
      # 2026-08-01：supabase_storage.py（GLB永久存储）与 /auth/check-email
      # 端点均依赖这两个变量；此前只在Render面板手动配置、render.yaml未声明，
      # 补上 sync:false 声明使配置可追溯（不含真实值，需在面板手动填写）。
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # 2026-08-12：/notify-redemption端点（水晶兑换通知邮件）用，两者均选填——
      # 任一缺失时该端点静默跳过发信、不影响主流程（redemption_requests表
      # 才是权威数据，见main.py端点注释），需在Render面板手动填值。
      - key: RESEND_API_KEY
        sync: false
      - key: OWNER_NOTIFY_EMAIL
        sync: false
    disk:
      name: island-cache
      mountPath: /opt/render/project/src/island_service/persistent_data
      sizeGB: 1

  # ── 未来扩展服务在此继续添加 ──────────────────────────────────
  # - type: web
  #   name: simabazi-xxx
  #   ...
