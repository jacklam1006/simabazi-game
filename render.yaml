services:
  # ── 岛屿生成后端（FastAPI + Gemini + TripoAI）────────────────
  - type: web
    name: simabazi-island
    runtime: python
    region: singapore
    pythonVersion: "3.11.8"
    rootDir: island_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3-pro-image
      - key: TRIPO_API_KEY
        sync: false
    disk:
      name: island-cache
      mountPath: /opt/render/project/src/island_service
      sizeGB: 1

  # ── 未来扩展服务在此继续添加 ──────────────────────────────────
  # - type: web
  #   name: simabazi-xxx
  #   ...
